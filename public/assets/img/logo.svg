<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 96" width="300" height="96" role="img" aria-label="World Students · Дніпровська політехніка">
  <defs>
    <linearGradient id="lgBadge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a6fc4"/>
      <stop offset="1" stop-color="#0b3559"/>
    </linearGradient>
    <linearGradient id="lgStep" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#bfe3ff"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
  </defs>
  <!-- mark: badge, staircase (Polytechnic, growth), orbit wrapping it + gold satellite (World Students) -->
  <clipPath id="lgFront"><rect x="0" y="49" width="44" height="40"/></clipPath>
  <rect x="4" y="10" width="76" height="76" rx="22" fill="url(#lgBadge)"/>
  <ellipse cx="42" cy="49" rx="32" ry="12" fill="none" stroke="#4fc3f7" stroke-width="2.6" stroke-opacity=".45" transform="rotate(-28 42 49)"/>
  <path d="M21 71V59H34V47H47V35H62V71Z" fill="url(#lgStep)" stroke="url(#lgStep)" stroke-width="4" stroke-linejoin="round"/>
  <ellipse cx="42" cy="49" rx="32" ry="12" fill="none" stroke="#4fc3f7" stroke-width="2.6" transform="rotate(-28 42 49)" clip-path="url(#lgFront)"/>
  <circle cx="69" cy="28" r="8.5" fill="#ffcb47" fill-opacity=".22"/>
  <circle cx="69" cy="28" r="5" fill="#ffcb47"/>
  <!-- wordmark -->
  <text x="94" y="30" font-family="Manrope, Montserrat, 'Segoe UI', Arial, sans-serif" font-weight="700" font-size="10.5" letter-spacing="2.2" fill="#1a6fc4">WORLD STUDENTS</text>
  <text x="93" y="55" font-family="Manrope, Montserrat, 'Segoe UI', Arial, sans-serif" font-weight="800" font-size="21" letter-spacing="0.2" fill="#0f2f52">ДНІПРОВСЬКА</text>
  <text x="93" y="76" font-family="Manrope, Montserrat, 'Segoe UI', Arial, sans-serif" font-weight="800" font-size="21" letter-spacing="0.2" fill="#0f2f52">ПОЛІТЕХНІКА</text>
  <rect x="94" y="83" width="24" height="3" rx="1.5" fill="#ffcb47"/>
  <text x="124" y="87" font-family="Manrope, Montserrat, 'Segoe UI', Arial, sans-serif" font-weight="600" font-size="8.5" letter-spacing="1.4" fill="#6b7c93">ВІД СТУДЕНТІВ · 1899</text>
</svg>
