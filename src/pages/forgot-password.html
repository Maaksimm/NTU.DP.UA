<main id="main" class="auth-shell">
<div class="auth-grid reveal">
<div class="auth-side"><img src="assets/img/logo.svg" style="width:150px;background:white;border-radius:12px;padding:8px" alt="">
<h2>Відновлення доступу</h2>
<p>Вкажіть пошту, з якою реєструвалися, і ми надішлемо лист для встановлення нового пароля.</p>
</div>
<form class="auth-form" data-auth-form="forgot" novalidate>
<div class="label">Доступ</div>
<h1 style="font-size:34px;margin-bottom:8px">Забули пароль?</h1>
<div class="field"><label for="fp-email">Email</label><input id="fp-email" name="email" type="email" required maxlength="254" autocomplete="email" placeholder="student@example.com"></div>
<button class="btn btn-primary" style="width:100%" type="submit">Надіслати лист</button>
<p data-form-status class="form-note-status" role="status"></p>
<p style="margin-top:16px"><a href="login.html">Повернутися до входу</a></p>
</form>
</div>
</main>
