<main id="main">
<section class="page-hero">
<div class="container reveal">
<nav class="breadcrumb" aria-label="Breadcrumb"><a href="index.html">Головна</a><span class="crumb-sep">›</span><a href="student-life.html">Студентам</a><span class="crumb-sep">›</span><span aria-current="page">Історії студентів</span></nav>
<h1>Історії студентів</h1>
<p class="lead">Сторіз на 24 години й розповіді, які залишаються. Пишуть самі студенти Політехніки.</p>
</div>
</section>

<section class="stories-section" aria-label="Сторіз">
<div class="container"><div class="stories" data-stories></div></div>
</section>

<section class="section" data-tales>
<div class="container tales-layout">
<div>
<div class="section-head reveal"><h2>Стрічка історій</h2></div>
<div class="tales__filter" data-tales-filter role="group" aria-label="Тема"></div>
<div class="tales__list" data-tales-list aria-live="polite"></div>
</div>

<aside class="tales-side">
<form class="form-card" data-tales-form hidden novalidate>
<div class="form-head"><h3>Розкажи свою історію</h3></div>
<div class="field">
<label for="tl-title">Заголовок<span class="required">*</span></label>
<input id="tl-title" name="ti" type="text" required minlength="3" maxlength="120" placeholder="Наприклад: мій семестр у Польщі">
</div>
<div class="field">
<label for="tl-cat">Тема</label>
<select id="tl-cat" name="cat"></select>
</div>
<div class="field">
<label for="tl-body">Історія<span class="required">*</span></label>
<textarea id="tl-body" name="b" rows="7" required minlength="30" maxlength="4000" placeholder="Що сталося, що допомогло, що порадиш іншим"></textarea>
</div>
<div class="field">
<label for="tl-photo">Фото</label>
<input id="tl-photo" name="photo" type="file" accept="image/jpeg,image/png,image/webp">
</div>
<button class="btn btn-primary btn-primary--full" type="submit">Опублікувати</button>
<p class="form-note-status" aria-live="polite"></p>
</form>
<div class="card" data-tales-gate>
<h3>Розкажи свою історію</h3>
<p data-tales-why>Увійдіть, щоб публікувати.</p>
<a class="btn btn-primary" href="login.html">Увійти</a>
</div>
</aside>
</div>
</section>
</main>
